name: Fetch Repository Traffic

on:
  schedule:
    - cron: '0 0 * * *' # Runs every day at midnight UTC
  workflow_dispatch: # Allows you to run it manually

jobs:
  logger:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Allows the bot to commit data to your repo

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Create Data Directory
      run: mkdir -p traffic-data

    - name: Fetch Traffic Data
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPO: ${{ github.repository }}
      run: |
        # Fetch views and clones using the GitHub CLI
        gh api repos/$REPO/traffic/views > traffic-data/views-$(date +%F).json
        gh api repos/$REPO/traffic/clones > traffic-data/clones-$(date +%F).json

    - name: Commit and Push Data
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        # Stage all changes in our traffic folder
        git add traffic-data/*
        
        # Check if there are any modified or new files staged
        if git diff --cached --quiet; then
          echo "No new traffic data changed since the last run. Skipping commit."
        else
          git commit -m "chore: update traffic logs [skip ci]"
          git push
        fi
